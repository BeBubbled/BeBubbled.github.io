<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="description" content="Research notes and learning resources by BeBubble.">
  <title>BeBubble | Research Notes</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

  <style>
    :root {
      --theme-color: #2d5d7b;
      --theme-color-dark: #1e4359;
      --profile-rail-width: 16rem;
      --base-font-size: 17px;
      --base-line-height: 1.72;
      --heading-font-family: Georgia, 'Times New Roman', serif;
      --base-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      color: #252b32;
      background: #fff;
    }

    .app-nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      box-sizing: border-box;
      min-height: 4.25rem;
      padding: .85rem 2rem;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid #e4e8ea;
      text-align: initial;
      backdrop-filter: blur(8px);
    }

    .site-nav {
      display: flex;
      align-items: center;
      max-width: 57rem;
      min-height: 2.5rem;
      margin: 0 auto;
    }

    .site-nav__brand {
      color: #172a36 !important;
      font-family: var(--heading-font-family);
      font-size: 1.25rem !important;
      font-weight: 600 !important;
      letter-spacing: -.02em !important;
    }

    .profile-rail {
      position: fixed;
      top: 4.25rem;
      bottom: 0;
      left: 0;
      z-index: 20;
      box-sizing: border-box;
      width: var(--profile-rail-width);
      padding: 3.2rem 2rem;
      background: #fbfcfd;
      border-right: 1px solid #dfe5e8;
    }

    .profile-rail__avatar {
      display: block;
      width: 10.5rem;
      height: 10.5rem;
      margin: 0 auto 1.4rem;
      object-fit: cover;
      border: 1px solid #e3e8ea;
      border-radius: 50%;
    }

    .profile-rail__name {
      display: block;
      color: #172a36;
      font-family: var(--heading-font-family);
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -.015em;
      text-align: center;
    }

    .profile-rail__bio {
      margin: .65rem 0 1rem;
      color: #64717a;
      font-size: .88rem;
      line-height: 1.55;
      text-align: center;
    }

    .profile-rail__link {
      display: block;
      color: #2d5d7b;
      font-size: .87rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .site-nav__links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-left: auto;
    }

    .app-nav a,
    .top-notes summary {
      color: #52616b;
      font-size: .88rem;
      font-weight: 600;
      letter-spacing: .02em;
      text-decoration: none;
    }

    .app-nav a:hover,
    .top-notes summary:hover {
      color: var(--theme-color);
    }

    .top-notes {
      position: relative;
    }

    .top-notes summary {
      cursor: pointer;
      list-style: none;
    }

    .top-notes summary::-webkit-details-marker {
      display: none;
    }

    .top-notes summary::after {
      margin-left: .35rem;
      content: '⌄';
      font-size: .9rem;
    }

    .top-notes[open] summary::after {
      content: '⌃';
    }

    .top-notes__menu {
      position: absolute;
      top: 1.9rem;
      right: 0;
      width: 15.5rem;
      padding: .55rem .85rem;
      background: #fff;
      border: 1px solid #dfe5e8;
      box-shadow: 0 10px 24px rgba(25, 46, 60, .1);
    }

    .top-notes__menu a {
      display: block;
      padding: .38rem 0;
      font-size: .84rem;
      font-weight: 500;
    }

    .top-notes__menu a:first-child {
      padding-bottom: .6rem;
      margin-bottom: .3rem;
      border-bottom: 1px solid #e4e8ea;
      font-weight: 700;
    }

    .content {
      right: 0;
      left: var(--profile-rail-width) !important;
      padding-top: 4.25rem;
      padding-left: 0;
    }

    .sidebar,
    .sidebar-toggle {
      display: none !important;
    }

    .markdown-section {
      box-sizing: border-box;
      width: 100%;
      max-width: 51rem;
      margin-right: auto !important;
      margin-left: auto !important;
      padding: 4.2rem 2.6rem 5rem;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: #172a36;
      font-family: var(--heading-font-family);
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .markdown-section h1 {
      margin-bottom: 1.3rem;
      font-size: 2.4rem;
    }

    .markdown-section h2 {
      margin-top: 2.55rem;
      font-size: 1.55rem;
    }

    .markdown-section a {
      color: #2d5d7b;
    }

    .markdown-section blockquote {
      color: #64717a;
      border-left: 3px solid #9db6c5;
    }

    @media screen and (max-width: 768px) {
      .app-nav {
        min-height: 3.9rem;
        padding: .7rem 1.1rem;
      }

      .site-nav__brand {
        font-size: 1.1rem !important;
      }

      .site-nav__links {
        gap: .8rem;
      }

      .app-nav a,
      .top-notes summary {
        font-size: .78rem;
      }

      .content {
        left: 0 !important;
        padding-top: 3.9rem;
      }

      .profile-rail {
        display: none;
      }

      .markdown-section {
        padding: 2.25rem 1.35rem 3.5rem;
      }

      .markdown-section h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <aside class="profile-rail" aria-label="Profile">
    <img class="profile-rail__avatar" src="About.assets/IMG_2550.jpg" alt="BeBubble avatar">
    <strong class="profile-rail__name">BeBubble</strong>
    <p class="profile-rail__bio">Research notes, learning resources, and experiments.</p>
    <a class="profile-rail__link" href="https://github.com/BeBubbled" target="_blank" rel="noopener">GitHub profile ↗</a>
  </aside>
  <script>
    window.$docsify = {
      name: 'BeBubble',
      repo: 'https://github.com/BeBubbled/BeBubbled.github.io',
      homepage: 'About.md',
      loadSidebar: false,
      loadNavbar: '_navbar.md',
      auto2top: true,
      noEmoji: true,
      subMaxLevel: 3,
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      themeable: {
        readyTransition: true,
        responsiveTables: true
      },
      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-latex@0"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://unpkg.com/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
</body>
</html>
